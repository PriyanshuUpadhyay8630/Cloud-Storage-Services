<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Button</title>
    
    <style>
        .floating-whatsapp {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25D366; /* Official WhatsApp Green */
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 2px 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        /* Hover Effect */
        .floating-whatsapp:hover {
            background-color: #128C7E;
            transform: scale(1.05); /* Thoda bada ho jayega hover par */
            color: white;
        }

        /* WhatsApp Icon Style */
        .whatsapp-icon {
            margin-right: 10px;
            font-size: 22px;
        }

        /* Animation (Blink) */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
        .floating-whatsapp {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

    <a href="https://wa.me/918630702134" target="_blank" class="floating-whatsapp">
        <span class="whatsapp-icon">💬</span> Chat with Us
    </a>

</body>
</html>
